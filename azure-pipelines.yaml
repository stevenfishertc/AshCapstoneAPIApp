trigger:
  branches:
    include:
      - main

variables:
  # ----- Container Registry -----
  DEV_ACR_NAME: acrcapstonedeva1b2c
  QA_ACR_NAME: acrcapstoneqaa1b2c
  PROD_ACR_NAME: acrcapstoneproda1b2c
  ACR_LOGIN_SERVER_SUFFIX: .azurecr.io
  IMAGE_TAG: $(Build.BuildId)

  # Image repos in ACR
  BACKEND_A_IMAGE: backend-a
  BACKEND_B_IMAGE: backend-b

  # ----- Service Connections (AzureRM) -----
  AZURE_SUBSCRIPTION: 'stevens-capstone-conn'
  DEV_SERVICE_CONN: stevens-capstone-dev-conn
  QA_SERVICE_CONN: stevens-capstone-qa-conn
  PROD_SERVICE_CONN: stevens-capstone-prod-conn

  # ----- AKS / RG -----
  DEV_RESOURCE_GROUP: steven-rg-capstone-dev
  QA_RESOURCE_GROUP: steven-rg-capstone-qa
  PROD_RESOURCE_GROUP: steven-rg-capstone-prod

  DEV_AKS_NAME: aks-capstone-dev
  QA_AKS_NAME: aks-capstone-qa
  PROD_AKS_NAME: aks-capstone-prod


  # ----- Kubernetes -----
  K8S_NAMESPACE: capstone-backend
  # Adjust if your container listens on a different port
  CONTAINER_PORT: "8080"
  REPLICAS: "2"

  # ----- APIM -----
  DEV_APIM_NAME: apim-capstone-dev-a1b2c
  QA_APIM_NAME: apim-capstone-qa-a1b2c
  PROD_APIM_NAME: apim-capstone-prod-a1b2c

  # APIM API IDs (the "api-id" inside APIM). Set these to whatever you use.
  # If you expose both backends separately in APIM, keep both IDs.
  APIM_API_ID_A: backend-a
  APIM_API_ID_B: backend-b

pool:
  vmImage: ubuntu-latest

stages:
# =========================
# 1) BUILD AND PUSH TO DEV
# =========================
- stage: Deploy_Dev
  displayName: Deploy to AKS (DEV)
  jobs:
  - job: DeployDev
    displayName: Deploy backend-a & backend-b to aks-capstone-dev
    steps:
    - checkout: self

    # ---------- LOGIN TO ACR ----------
    - task: AzureCLI@2
      displayName: "Azure Login ACR (DEV)"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(DEV_ACR_NAME)

    # ---------- BUILD DOCKER ----------
    - script: |
        docker build -f backend-a/Dockerfile \
          -t $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(Build.BuildId) backend-a

        docker build -f backend-b/Dockerfile \
          -t $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(Build.BuildId) backend-b
      displayName: Build Images (DEV)

    # ---------- PUSH IMAGES ----------
    - script: |
        docker push $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
        docker push $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)
      displayName: "Push Images to ACR (DEV)"

    # ---------- DEPLOY TO AKS ----------
    - task: AzureCLI@2
      displayName: Deploy to AKS (DEV)
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          # export KUBECONFIG=$HOME/.kube/config
          # mkdir -p $HOME/.kube

          az aks get-credentials \
            --resource-group $(DEV_RESOURCE_GROUP) \
            --name $(DEV_AKS_NAME) \
            --admin \
            --overwrite-existing

          # kubectl config current-context
          # kubectl get nodes

          kustomize edit set image backend-a=acrcapstonedeva1b2c.azurecr.io/backend-a:$(Build.BuildId) backend-b=acrcapstonedeva1b2c.azurecr.io/backend-b:$(Build.BuildId)

          kubectl apply -k k8s/overlays/dev

          kubectl rollout status deployment/backend-a-steven -n $(K8S_NAMESPACE)
          kubectl rollout status deployment/backend-b-steven -n $(K8S_NAMESPACE)

# =========================
# 2) BUILD AND PUSH TO QA
# =========================
- stage: Deploy_QA
  displayName: Deploy to AKS (QA)
  dependsOn: Deploy_Dev
  jobs:
  - deployment: DeployQA
    displayName: Deploy backend-a & backend-b to aks-capstone-qa
    environment: qa-env  # add approvals here if desired
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # ---------- LOGIN TO ACR ----------
          - task: AzureCLI@2
            displayName: "Azure Login ACR (QA)"
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(QA_ACR_NAME)

          # ---------- BUILD DOCKER ----------
          - script: |
              docker build -f backend-a/Dockerfile \
                -t $(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(Build.BuildId) backend-a

              docker build -f backend-b/Dockerfile \
                -t $(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(Build.BuildId) backend-b
            displayName: Build Images (QA)

          # ---------- PUSH IMAGES ----------
          - script: |
              docker push $(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
              docker push $(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)
            displayName: "Push Images to ACR (QA)"

          # ---------- DEPLOY TO AKS ----------
          - task: AzureCLI@2
            displayName: Deploy to AKS (QA)
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # export KUBECONFIG=$HOME/.kube/config
                # mkdir -p $HOME/.kube

                az aks get-credentials \
                  --resource-group $(QA_RESOURCE_GROUP) \
                  --name $(QA_AKS_NAME) \
                  --admin \
                  --overwrite-existing

                # kubectl config current-context
                # kubectl get nodes

                kustomize edit set image backend-a=acrcapstoneqaa1b2c.azurecr.io/backend-a:$(Build.BuildId) backend-b=acrcapstoneqaa1b2c.azurecr.io/backend-b:$(Build.BuildId)

                kubectl apply -k k8s/overlays/qa

                kubectl rollout status deployment/backend-a-steven -n $(K8S_NAMESPACE)
                kubectl rollout status deployment/backend-b-steven -n $(K8S_NAMESPACE)

# =========================
# 3) BUILD AND PUSH TO PROD
# =========================
- stage: Deploy_Prod
  displayName: Deploy to AKS (PROD)
  dependsOn: Deploy_QA
  jobs:
  - deployment: DeployProd
    displayName: Deploy backend-a & backend-b to aks-capstone-prod
    environment: production-env  # typically approvals required here
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # ---------- LOGIN TO ACR ----------
          - task: AzureCLI@2
            displayName: "Azure Login ACR (PROD)"
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(PROD_ACR_NAME)

          # ---------- BUILD DOCKER ----------
          - script: |
              docker build -f backend-a/Dockerfile \
                -t $(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(Build.BuildId) backend-a

              docker build -f backend-b/Dockerfile \
                -t $(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(Build.BuildId) backend-b
            displayName: Build Images (PROD)

          # ---------- PUSH IMAGES ----------
          - script: |
              docker push $(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
              docker push $(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)
            displayName: "Push Images to ACR (PROD)"

          # ---------- DEPLOY TO AKS ----------
          - task: AzureCLI@2
            displayName: Deploy to AKS (PROD)
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # export KUBECONFIG=$HOME/.kube/config
                # mkdir -p $HOME/.kube

                az aks get-credentials \
                  --resource-group $(PROD_RESOURCE_GROUP) \
                  --name $(PROD_AKS_NAME) \
                  --admin \
                  --overwrite-existing

                # kubectl config current-context
                # kubectl get nodes

                kustomize edit set image backend-a=acrcapstoneproda1b2c.azurecr.io/backend-a:$(Build.BuildId) backend-b=acrcapstoneproda1b2c.azurecr.io/backend-b:$(Build.BuildId)

                kubectl apply -k k8s/overlays/prod

                kubectl rollout status deployment/backend-a-steven -n $(K8S_NAMESPACE)
                kubectl rollout status deployment/backend-b-steven -n $(K8S_NAMESPACE)