trigger:
  branches:
    include:
      - main

variables:
  # ----- Container Registry -----
  ACR_NAME: acrcapstonedeva1b2c
  IMAGE_TAG: $(Build.BuildId)

  # Image repos in ACR
  BACKEND_A_IMAGE: backend-a
  BACKEND_B_IMAGE: backend-b

  # ----- Service Connections (AzureRM) -----
  DEV_SERVICE_CONN: stevens-capstone-dev-conn
  QA_SERVICE_CONN: stevens-capstone-qa-conn
  PROD_SERVICE_CONN: stevens-capstone-prod-conn

  # ----- AKS / RG -----
  DEV_RESOURCE_GROUP: steven-rg-capstone-dev
  QA_RESOURCE_GROUP: steven-rg-capstone-qa
  PROD_RESOURCE_GROUP: steven-rg-capstone-prod

  DEV_AKS_NAME: aks-capstone-dev
  QA_AKS_NAME: aks-capstone-qa
  PROD_AKS_NAME: aks-capstone-prod

  # ----- Kubernetes -----
  K8S_NAMESPACE: capstone-backend
  # Adjust if your container listens on a different port
  CONTAINER_PORT: "8080"
  REPLICAS: "2"

  # ----- APIM -----
  DEV_APIM_NAME: apim-capstone-dev-a1b2c
  QA_APIM_NAME: apim-capstone-qa-a1b2c
  PROD_APIM_NAME: apim-capstone-prod-a1b2c

  # APIM API IDs (the "api-id" inside APIM). Set these to whatever you use.
  # If you expose both backends separately in APIM, keep both IDs.
  APIM_API_ID_A: backend-a
  APIM_API_ID_B: backend-b

pool:
  vmImage: ubuntu-latest

stages:
# =========================
# 1) BUILD + PUSH IMAGES
# =========================
- stage: BuildAndPush
  displayName: Build & Push Backend Images to ACR
  jobs:
  - job: BuildPush
    displayName: Docker build → ACR push (backend-a, backend-b)
    steps:
    - checkout: self

    # Login to Azure (DEV subscription assumed to own the ACR; adjust if needed)
    - task: AzureCLI@2
      displayName: Azure Login (for ACR)
      inputs:
        azureSubscription: $(DEV_SERVICE_CONN)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az account show -o table
          az acr show -n $(ACR_NAME) -o table

    # Login to ACR
    - task: AzureCLI@2
      displayName: ACR Login
      inputs:
        azureSubscription: $(DEV_SERVICE_CONN)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az acr login -n $(ACR_NAME)

    # Build & push backend-a
    - script: |
        set -euo pipefail
        ACR_LOGIN_SERVER="$(ACR_NAME).azurecr.io"
        echo "Building backend-a..."
        docker build -f backend-a/Dockerfile -t $ACR_LOGIN_SERVER/$(BACKEND_A_IMAGE):$(IMAGE_TAG) backend-a
        docker push $ACR_LOGIN_SERVER/$(BACKEND_A_IMAGE):$(IMAGE_TAG)

        # Optionally also push "latest" on main
        docker tag $ACR_LOGIN_SERVER/$(BACKEND_A_IMAGE):$(IMAGE_TAG) $ACR_LOGIN_SERVER/$(BACKEND_A_IMAGE):latest
        docker push $ACR_LOGIN_SERVER/$(BACKEND_A_IMAGE):latest
      displayName: Build & Push backend-a

    # Build & push backend-b
    - script: |
        set -euo pipefail
        ACR_LOGIN_SERVER="$(ACR_NAME).azurecr.io"
        echo "Building backend-b..."
        docker build -f backend-b/Dockerfile -t $ACR_LOGIN_SERVER/$(BACKEND_B_IMAGE):$(IMAGE_TAG) backend-b
        docker push $ACR_LOGIN_SERVER/$(BACKEND_B_IMAGE):$(IMAGE_TAG)

        # Optionally also push "latest" on main
        docker tag $ACR_LOGIN_SERVER/$(BACKEND_B_IMAGE):$(IMAGE_TAG) $ACR_LOGIN_SERVER/$(BACKEND_B_IMAGE):latest
        docker push $ACR_LOGIN_SERVER/$(BACKEND_B_IMAGE):latest
      displayName: Build & Push backend-b

# =========================
# 2) DEPLOY TO DEV
# =========================
- stage: Deploy_Dev
  displayName: Deploy to AKS (DEV)
  dependsOn: BuildAndPush
  jobs:
  - job: DeployDev
    displayName: Deploy backend-a & backend-b to aks-capstone-dev
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Install kubectl
      inputs:
        azureSubscription: $(DEV_SERVICE_CONN)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az aks install-cli

    - task: AzureCLI@2
      displayName: Get AKS Credentials (DEV)
      inputs:
        azureSubscription: $(DEV_SERVICE_CONN)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az aks get-credentials \
            -g $(DEV_RESOURCE_GROUP) \
            -n $(DEV_AKS_NAME) \
            --overwrite-existing

    - script: |
        set -euo pipefail

        ACR_LOGIN_SERVER="$(ACR_NAME).azurecr.io"
        IMG_A="$ACR_LOGIN_SERVER/$(BACKEND_A_IMAGE):$(IMAGE_TAG)"
        IMG_B="$ACR_LOGIN_SERVER/$(BACKEND_B_IMAGE):$(IMAGE_TAG)"

        kubectl get ns $(K8S_NAMESPACE) >/dev/null 2>&1 || \
          kubectl create ns $(K8S_NAMESPACE)

        cat <<EOF | kubectl apply -n $(K8S_NAMESPACE) -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: backend-a
        spec:
          replicas: $(REPLICAS)
          selector:
            matchLabels:
              app: backend-a
          template:
            metadata:
              labels:
                app: backend-a
            spec:
              containers:
                - name: backend-a
                  image: ${IMG_A}
                  ports:
                    - containerPort: $(CONTAINER_PORT)
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: backend-a-svc
        spec:
          type: ClusterIP
          selector:
            app: backend-a
          ports:
            - port: 80
              targetPort: $(CONTAINER_PORT)
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: backend-b
        spec:
          replicas: $(REPLICAS)
          selector:
            matchLabels:
              app: backend-b
          template:
            metadata:
              labels:
                app: backend-b
            spec:
              containers:
                - name: backend-b
                  image: ${IMG_B}
                  ports:
                    - containerPort: $(CONTAINER_PORT)
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: backend-b-svc
        spec:
          type: ClusterIP
          selector:
            app: backend-b
          ports:
            - port: 80
              targetPort: $(CONTAINER_PORT)
        EOF

        kubectl rollout status deploy/backend-a -n $(K8S_NAMESPACE)
        kubectl rollout status deploy/backend-b -n $(K8S_NAMESPACE)
      displayName: Deploy to DEV

# =========================
# 3) DEPLOY TO QA
# =========================
- stage: Deploy_QA
  displayName: Deploy to AKS (QA)
  dependsOn: Deploy_Dev
  jobs:
  - deployment: DeployQA
    displayName: Deploy backend-a & backend-b to aks-capstone-qa
    environment: qa-env  # add approvals here if desired
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Install kubectl
            inputs:
              azureSubscription: $(QA_SERVICE_CONN)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az aks install-cli

          - task: AzureCLI@2
            displayName: Get AKS Credentials (QA)
            inputs:
              azureSubscription: $(QA_SERVICE_CONN)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az aks get-credentials -g $(QA_RESOURCE_GROUP) -n $(QA_AKS_NAME) --overwrite-existing
                kubectl version --client=true

          - script: |
              set -euo pipefail

              ACR_LOGIN_SERVER="$(ACR_NAME).azurecr.io"
              IMG_A="$ACR_LOGIN_SERVER/$(BACKEND_A_IMAGE):$(IMAGE_TAG)"
              IMG_B="$ACR_LOGIN_SERVER/$(BACKEND_B_IMAGE):$(IMAGE_TAG)"

              kubectl get ns $(K8S_NAMESPACE) >/dev/null 2>&1 || kubectl create ns $(K8S_NAMESPACE)

              cat <<EOF | kubectl apply -n $(K8S_NAMESPACE) -f -
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: backend-a
              spec:
                replicas: $(REPLICAS)
                selector:
                  matchLabels:
                    app: backend-a
                template:
                  metadata:
                    labels:
                      app: backend-a
                  spec:
                    containers:
                      - name: backend-a
                        image: ${IMG_A}
                        imagePullPolicy: IfNotPresent
                        ports:
                          - containerPort: $(CONTAINER_PORT)
                        env:
                          - name: PORT
                            value: "$(CONTAINER_PORT)"
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: backend-a-svc
              spec:
                type: ClusterIP
                selector:
                  app: backend-a
                ports:
                  - name: http
                    port: 80
                    targetPort: $(CONTAINER_PORT)
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: backend-b
              spec:
                replicas: $(REPLICAS)
                selector:
                  matchLabels:
                    app: backend-b
                template:
                  metadata:
                    labels:
                      app: backend-b
                  spec:
                    containers:
                      - name: backend-b
                        image: ${IMG_B}
                        imagePullPolicy: IfNotPresent
                        ports:
                          - containerPort: $(CONTAINER_PORT)
                        env:
                          - name: PORT
                            value: "$(CONTAINER_PORT)"
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: backend-b-svc
              spec:
                type: ClusterIP
                selector:
                  app: backend-b
                ports:
                  - name: http
                    port: 80
                    targetPort: $(CONTAINER_PORT)
              EOF

              kubectl rollout status deploy/backend-a -n $(K8S_NAMESPACE) --timeout=180s
              kubectl rollout status deploy/backend-b -n $(K8S_NAMESPACE) --timeout=180s
            displayName: Deploy to QA (kubectl apply)

          - task: AzureCLI@2
            displayName: APIM (QA) - Update API service URLs (optional)
            inputs:
              azureSubscription: $(QA_SERVICE_CONN)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                INGRESS_NS="ingress-nginx"
                INGRESS_SVC="ingress-nginx-controller"
                INGRESS_IP="$(kubectl get svc -n ${INGRESS_NS} ${INGRESS_SVC} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
                INGRESS_HOST="$(kubectl get svc -n ${INGRESS_NS} ${INGRESS_SVC} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"

                BASE=""
                if [ -n "${INGRESS_IP}" ]; then BASE="http://${INGRESS_IP}"; fi
                if [ -z "${BASE}" ] && [ -n "${INGRESS_HOST}" ]; then BASE="http://${INGRESS_HOST}"; fi

                if [ -z "${BASE}" ]; then
                  echo "No ingress IP/hostname found. Skipping APIM update."
                  exit 0
                fi

                URL_A="${BASE}/backend-a"
                URL_B="${BASE}/backend-b"

                az apim api update \
                  --service-name $(QA_APIM_NAME) \
                  --resource-group $(QA_RESOURCE_GROUP) \
                  --api-id $(APIM_API_ID_A) \
                  --set serviceUrl="${URL_A}" \
                  -o none || echo "API '$(APIM_API_ID_A)' not found in APIM; skipping."

                az apim api update \
                  --service-name $(QA_APIM_NAME) \
                  --resource-group $(QA_RESOURCE_GROUP) \
                  --api-id $(APIM_API_ID_B) \
                  --set serviceUrl="${URL_B}" \
                  -o none || echo "API '$(APIM_API_ID_B)' not found in APIM; skipping."

# =========================
# 4) DEPLOY TO PROD
# =========================
- stage: Deploy_Prod
  displayName: Deploy to AKS (PROD)
  dependsOn: Deploy_QA
  jobs:
  - deployment: DeployProd
    displayName: Deploy backend-a & backend-b to aks-capstone-prod
    environment: production-env  # typically approvals required here
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Install kubectl
            inputs:
              azureSubscription: $(PROD_SERVICE_CONN)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az aks install-cli

          - task: AzureCLI@2
            displayName: Get AKS Credentials (PROD)
            inputs:
              azureSubscription: $(PROD_SERVICE_CONN)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az aks get-credentials -g $(PROD_RESOURCE_GROUP) -n $(PROD_AKS_NAME) --overwrite-existing
                kubectl version --client=true

          - script: |
              set -euo pipefail

              ACR_LOGIN_SERVER="$(ACR_NAME).azurecr.io"
              IMG_A="$ACR_LOGIN_SERVER/$(BACKEND_A_IMAGE):$(IMAGE_TAG)"
              IMG_B="$ACR_LOGIN_SERVER/$(BACKEND_B_IMAGE):$(IMAGE_TAG)"

              kubectl get ns $(K8S_NAMESPACE) >/dev/null 2>&1 || kubectl create ns $(K8S_NAMESPACE)

              cat <<EOF | kubectl apply -n $(K8S_NAMESPACE) -f -
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: backend-a
              spec:
                replicas: $(REPLICAS)
                selector:
                  matchLabels:
                    app: backend-a
                template:
                  metadata:
                    labels:
                      app: backend-a
                  spec:
                    containers:
                      - name: backend-a
                        image: ${IMG_A}
                        imagePullPolicy: IfNotPresent
                        ports:
                          - containerPort: $(CONTAINER_PORT)
                        env:
                          - name: PORT
                            value: "$(CONTAINER_PORT)"
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: backend-a-svc
              spec:
                type: ClusterIP
                selector:
                  app: backend-a
                ports:
                  - name: http
                    port: 80
                    targetPort: $(CONTAINER_PORT)
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: backend-b
              spec:
                replicas: $(REPLICAS)
                selector:
                  matchLabels:
                    app: backend-b
                template:
                  metadata:
                    labels:
                      app: backend-b
                  spec:
                    containers:
                      - name: backend-b
                        image: ${IMG_B}
                        imagePullPolicy: IfNotPresent
                        ports:
                          - containerPort: $(CONTAINER_PORT)
                        env:
                          - name: PORT
                            value: "$(CONTAINER_PORT)"
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: backend-b-svc
              spec:
                type: ClusterIP
                selector:
                  app: backend-b
                ports:
                  - name: http
                    port: 80
                    targetPort: $(CONTAINER_PORT)
              EOF

              kubectl rollout status deploy/backend-a -n $(K8S_NAMESPACE) --timeout=180s
              kubectl rollout status deploy/backend-b -n $(K8S_NAMESPACE) --timeout=180s
            displayName: Deploy to PROD (kubectl apply)

          - task: AzureCLI@2
            displayName: APIM (PROD) - Update API service URLs (optional)
            inputs:
              azureSubscription: $(PROD_SERVICE_CONN)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                INGRESS_NS="ingress-nginx"
                INGRESS_SVC="ingress-nginx-controller"
                INGRESS_IP="$(kubectl get svc -n ${INGRESS_NS} ${INGRESS_SVC} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
                INGRESS_HOST="$(kubectl get svc -n ${INGRESS_NS} ${INGRESS_SVC} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"

                BASE=""
                if [ -n "${INGRESS_IP}" ]; then BASE="http://${INGRESS_IP}"; fi
                if [ -z "${BASE}" ] && [ -n "${INGRESS_HOST}" ]; then BASE="http://${INGRESS_HOST}"; fi

                if [ -z "${BASE}" ]; then
                  echo "No ingress IP/hostname found. Skipping APIM update."
                  exit 0
                fi

                URL_A="${BASE}/backend-a"
                URL_B="${BASE}/backend-b"

                az apim api update \
                  --service-name $(PROD_APIM_NAME) \
                  --resource-group $(PROD_RESOURCE_GROUP) \
                  --api-id $(APIM_API_ID_A) \
                  --set serviceUrl="${URL_A}" \
                  -o none || echo "API '$(APIM_API_ID_A)' not found in APIM; skipping."

                az apim api update \
                  --service-name $(PROD_APIM_NAME) \
                  --resource-group $(PROD_RESOURCE_GROUP) \
                  --api-id $(APIM_API_ID_B) \
                  --set serviceUrl="${URL_B}" \
                  -o none || echo "API '$(APIM_API_ID_B)' not found in APIM; skipping."
