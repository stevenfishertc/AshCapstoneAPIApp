                done

                kubectl delete pod -n $(K8S_NAMESPACE) --all

# =========================================================
# MONITORING - PROMETHEUS & GRAFANA
# =========================================================
- stage: Monitoring
  displayName: "Deploy Prometheus & Grafana Monitoring"
  dependsOn: Prod
  condition: succeededOrFailed()
  jobs:
  - job: DeployMonitoring
    displayName: "Install monitoring stack on all clusters"
    steps:
    - checkout: self

    # ---------- DEPLOY TO DEV ----------
    - task: AzureCLI@2
      displayName: "Deploy Monitoring to DEV"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          echo "Connecting to DEV AKS cluster..."
          az aks get-credentials \
            --resource-group $(DEV_RESOURCE_GROUP) \
            --name $(DEV_AKS_NAME) \
            --admin \
            --overwrite-existing

          echo "Adding Prometheus Helm repository..."
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          echo "Cleaning up any failed previous installation..."
          helm uninstall prometheus -n monitoring 2>/dev/null || echo "No previous release to clean up"
          kubectl delete namespace monitoring --timeout=60s 2>/dev/null || echo "Namespace already clean"
          sleep 10

          echo "Installing kube-prometheus-stack (this may take 15-20 minutes)..."
          helm install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --values monitoring/prometheus-values.yaml \
            --timeout 20m

          echo "Waiting for Grafana pods to be ready..."
          kubectl wait --for=condition=ready pod \
            --selector=app.kubernetes.io/name=grafana \
            --namespace monitoring \
            --timeout=600s || echo "Grafana pods not ready yet, continuing..."

          echo "Waiting for Prometheus pods to be ready..."
          kubectl wait --for=condition=ready pod \
            --selector=app.kubernetes.io/name=prometheus \
            --namespace monitoring \
            --timeout=600s || echo "Prometheus pods not ready yet, continuing..."

          echo ""
          echo "Deploying Ingress for Prometheus and Grafana..."
          kubectl apply -f monitoring/monitoring-ingress.yaml

          echo ""
          echo "=========================================="
          echo "Waiting for Ingress LoadBalancer IP..."
          echo "=========================================="

          # Wait for Ingress LoadBalancer IP (reuses existing ingress-nginx)
          for i in {1..60}; do
            INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            if [ ! -z "$INGRESS_IP" ]; then
              echo "✅ Ingress LoadBalancer IP acquired: $INGRESS_IP"
              break
            fi
            echo "⏳ Waiting for Ingress LoadBalancer IP... ($i/60)"
            sleep 5
          done

          echo ""
          echo "=========================================="
          echo "📊 Monitoring DEV Environment"
          echo "=========================================="
          if [ ! -z "$INGRESS_IP" ]; then
            echo "🔍 Prometheus: http://$INGRESS_IP/prometheus"
            echo "📈 Grafana: http://$INGRESS_IP/grafana"
            echo "   Username: admin | Password: admin123"
          else
            echo "⚠️  Ingress IP not yet assigned"
            echo "   Check status: kubectl get svc ingress-nginx-controller -n ingress-nginx"
          fi
          echo "=========================================="

          kubectl apply -f monitoring/backend-servicemonitors.yaml || true
      continueOnError: true

    # ---------- DEPLOY TO QA ----------
    - task: AzureCLI@2
      displayName: "Deploy Monitoring to QA"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials --resource-group $(QA_RESOURCE_GROUP) --name $(QA_AKS_NAME) --admin --overwrite-existing
          helm repo update
          helm uninstall prometheus -n monitoring 2>/dev/null || echo "No previous release"
          kubectl delete namespace monitoring --timeout=60s 2>/dev/null || echo "Namespace clean"
          sleep 10
          helm install prometheus prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace --values monitoring/prometheus-values.yaml --timeout 20m
          kubectl wait --for=condition=ready pod --selector=app.kubernetes.io/name=grafana --namespace monitoring --timeout=600s || true
          kubectl wait --for=condition=ready pod --selector=app.kubernetes.io/name=prometheus --namespace monitoring --timeout=600s || true

          echo ""
          echo "Deploying Ingress for Prometheus and Grafana..."
          kubectl apply -f monitoring/monitoring-ingress.yaml

          echo ""
          echo "=========================================="
          echo "Waiting for Ingress LoadBalancer IP..."
          echo "=========================================="

          # Wait for Ingress LoadBalancer IP (reuses existing ingress-nginx)
          for i in {1..60}; do
            INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            if [ ! -z "$INGRESS_IP" ]; then
              echo "✅ Ingress LoadBalancer IP acquired: $INGRESS_IP"
              break
            fi
            echo "⏳ Waiting for Ingress LoadBalancer IP... ($i/60)"
            sleep 5
          done

          echo ""
          echo "=========================================="
          echo "📊 Monitoring QA Environment"
          echo "=========================================="
          if [ ! -z "$INGRESS_IP" ]; then
            echo "🔍 Prometheus: http://$INGRESS_IP/prometheus"
            echo "📈 Grafana: http://$INGRESS_IP/grafana"
            echo "   Username: admin | Password: admin123"
          else
            echo "⚠️  Ingress IP not yet assigned"
            echo "   Check status: kubectl get svc ingress-nginx-controller -n ingress-nginx"
          fi
          echo "=========================================="

          kubectl apply -f monitoring/backend-servicemonitors.yaml || true
      continueOnError: true

    # ---------- DEPLOY TO PROD ----------
    - task: AzureCLI@2
      displayName: "Deploy Monitoring to PROD"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials --resource-group $(PROD_RESOURCE_GROUP) --name $(PROD_AKS_NAME) --admin --overwrite-existing
          helm repo update
          helm uninstall prometheus -n monitoring 2>/dev/null || echo "No previous release"
          kubectl delete namespace monitoring --timeout=60s 2>/dev/null || echo "Namespace clean"
          sleep 10
          helm install prometheus prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace --values monitoring/prometheus-values.yaml --timeout 20m
          kubectl wait --for=condition=ready pod --selector=app.kubernetes.io/name=grafana --namespace monitoring --timeout=600s || true
          kubectl wait --for=condition=ready pod --selector=app.kubernetes.io/name=prometheus --namespace monitoring --timeout=600s || true

          echo ""
          echo "Deploying Ingress for Prometheus and Grafana..."
          kubectl apply -f monitoring/monitoring-ingress.yaml

          echo ""
          echo "=========================================="
          echo "Waiting for Ingress LoadBalancer IP..."
          echo "=========================================="

          # Wait for Ingress LoadBalancer IP (reuses existing ingress-nginx)
          for i in {1..60}; do
            INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            if [ ! -z "$INGRESS_IP" ]; then
              echo "✅ Ingress LoadBalancer IP acquired: $INGRESS_IP"
              break
            fi
            echo "⏳ Waiting for Ingress LoadBalancer IP... ($i/60)"
            sleep 5
          done

          echo ""
          echo "=========================================="
          echo "📊 Monitoring PROD Environment"
          echo "=========================================="
          if [ ! -z "$INGRESS_IP" ]; then
            echo "🔍 Prometheus: http://$INGRESS_IP/prometheus"
            echo "📈 Grafana: http://$INGRESS_IP/grafana"
            echo "   Username: admin | Password: admin123"
          else
            echo "⚠️  Ingress IP not yet assigned"
            echo "   Check status: kubectl get svc ingress-nginx-controller -n ingress-nginx"
          fi
          echo "=========================================="

          kubectl apply -f monitoring/backend-servicemonitors.yaml || true
      continueOnError: true
