                az aks get-credentials \
                  --resource-group $(QA_RESOURCE_GROUP) \
                  --name $(QA_AKS_NAME) \
                  --admin \
                  --overwrite-existing

                # Wait for nodes
                for i in {1..60}; do
                  NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "Ready" || echo "0")
                  if [ "$NODE_COUNT" -gt 0 ]; then
                    break
                  fi
                  sleep 10
                done

                kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.6/deploy/static/provider/cloud/deploy.yaml
                kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=500s
                kubectl patch svc ingress-nginx-controller -n ingress-nginx -p '{"spec":{"type":"LoadBalancer"}}'

                cd k8s/overlays/qa
                kustomize edit set image backend-a=$(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG) backend-b=$(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)

                # Commit updated image tags back to Git (GitOps)
                echo "Committing updated image tags to Git..."
                git config user.email "azure-pipeline@capstone.com"
                git config user.name "Azure Pipeline"

                # Show what changed
                echo "Changes to kustomization.yaml:"
                git diff kustomization.yaml

                git add kustomization.yaml
                if git commit -m "Update QA image tags to $(IMAGE_TAG) [skip ci]"; then
                  echo "✅ Changes committed to local branch"

                  # Push using GitHub authentication
                  echo "Pushing changes to repository..."
                  if [ -n "${GITHUB_PAT:-}" ] && [ "${GITHUB_PAT}" != "\$(GITHUB_PAT)" ]; then
                    echo "GITHUB_PAT is configured, pushing to repository..."
                    git push https://${GITHUB_PAT}@github.com/stevenfishertc/AshCapstoneAPIApp.git main:main
                    echo "✅ Successfully pushed image tag updates to Git"
                  else
                    echo "=========================================="
                    echo "⚠️  WARNING: GITHUB_PAT not configured"
                    echo "=========================================="
                    echo "Git push skipped. Image tags will not persist in Git."
                    echo "ArgoCD will revert to old tags from Git."
                    echo ""
                    echo "To enable GitOps sync:"
                    echo "1. Create GitHub Personal Access Token with 'repo' scope"
                    echo "2. Add GITHUB_PAT variable to Azure Pipeline (mark as secret)"
                    echo "3. Re-run the pipeline"
                    echo "=========================================="
                  fi
                else
                  echo "No changes to commit (kustomization.yaml already up to date)"
                fi

                kubectl apply -k .

                # Deploy ArgoCD Application for continuous GitOps sync
                echo "Deploying ArgoCD Application for QA..."
                kubectl apply -f ../../../argocd/app-qa.yaml

                for i in {1..60}; do
                  INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                  if [ ! -z "$INGRESS_IP" ]; then
                    az apim api update --resource-group $(QA_RESOURCE_GROUP) --service-name apim-capstone-qa-a1b2c --api-id backend-a-api --service-url "http://$INGRESS_IP/api/a"
                    az apim api update --resource-group $(QA_RESOURCE_GROUP) --service-name apim-capstone-qa-a1b2c --api-id backend-b-api --service-url "http://$INGRESS_IP/api/b"
                    break
                  fi
                  sleep 5
                done

                kubectl delete pod -n $(K8S_NAMESPACE) --all

# =========================================================
# PROD
# =========================================================
- stage: Prod
  displayName: "Deploy to Production"
  dependsOn: QA
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    displayName: "Deploy to PROD AKS"
    environment: production-env
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - bash: |
              echo "Current git status:"
              git status
              echo ""
              echo "Available branches:"
              git branch -a
              echo ""
              echo "Checking out main branch..."
              git checkout -B main origin/main
              git pull origin main
              echo "Now on branch: $(git branch --show-current)"
            displayName: "Switch to main branch"

          - task: AzureCLI@2
            displayName: "Deploy to PROD AKS"
            env:
              GITHUB_PAT: $(GITHUB_PAT)
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group $(PROD_RESOURCE_GROUP) \
                  --name $(PROD_AKS_NAME) \
                  --admin \
                  --overwrite-existing

                # Wait for nodes
                for i in {1..60}; do
                  NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "Ready" || echo "0")
                  if [ "$NODE_COUNT" -gt 0 ]; then
