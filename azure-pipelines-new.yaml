# =========================================================
# PIPELINE TRIGGER CONFIGURATION
# =========================================================
trigger:
  branches:
    include:
      - main

# =========================================================
# GLOBAL VARIABLES
# =========================================================
variables:
  # --- Azure Service Connection ---
  AZURE_SUBSCRIPTION: 'stevens-capstone-conn'

  # --- Container Registry Configuration ---
  DEV_ACR_NAME: acrcapstonedeva1b2c
  QA_ACR_NAME: acrcapstoneqaa1b2c
  PROD_ACR_NAME: acrcapstoneproda1b2c
  ACR_LOGIN_SERVER_SUFFIX: .azurecr.io
  IMAGE_TAG: $(Build.BuildId)

  # --- Resource Groups ---
  DEV_RESOURCE_GROUP: steven-rg-capstone-dev
  QA_RESOURCE_GROUP: steven-rg-capstone-qa
  PROD_RESOURCE_GROUP: steven-rg-capstone-prod

  # --- AKS Cluster Names ---
  DEV_AKS_NAME: aks-capstone-dev
  QA_AKS_NAME: aks-capstone-qa
  PROD_AKS_NAME: aks-capstone-prod

  # --- Kubernetes Configuration ---
  K8S_NAMESPACE: capstone-backend

  # --- SonarCloud SAST Configuration ---
  SONARCLOUD_SERVICE_CONNECTION: 'SonarCloud'
  SONARCLOUD_ORGANIZATION: "stevenfishertc"
  SONARCLOUD_PROJECT_KEY: "stevenfishertc_AshCapstoneAPIApp"
  SONARCLOUD_PROJECT_NAME: "AshCapstoneAPIApp"

# =========================================================
# BUILD AGENT POOL
# =========================================================
pool:
  vmImage: ubuntu-latest

# =========================================================
# PIPELINE STAGES
# =========================================================
stages:

# =========================================================
# SAST - SONARCLOUD CODE ANALYSIS
# =========================================================
- stage: SAST
  displayName: "SonarCloud Code Analysis"
  jobs:
  - job: SonarCloudAnalysis
    displayName: "Static Code Analysis"
    steps:
    # ---------- STEP 1: SET FETCH DEPTH ----------
    - checkout: self
      fetchDepth: 0  # Disable shallow fetch for blame information

    # ---------- STEP 2: INSTALL DEPENDENCIES FOR SONARCLOUD ----------
    - script: |
        cd backend-a && npm install && cd ..
        cd backend-b && npm install && cd ..
      displayName: "Install npm dependencies"

    # ---------- STEP 3: PREPARE ANALYSIS CONFIGURATION ----------
    - task: SonarCloudPrepare@4
      displayName: "Prepare Analysis Configuration"
      inputs:
        SonarCloud: $(SONARCLOUD_SERVICE_CONNECTION)
        organization: $(SONARCLOUD_ORGANIZATION)
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: $(SONARCLOUD_PROJECT_KEY)
        cliProjectName: $(SONARCLOUD_PROJECT_NAME)
        cliSources: 'backend-a,backend-b'
        extraProperties: |
          sonar.exclusions=**/node_modules/**,**/*.spec.js,**/*.test.js

    # ---------- STEP 4: RUN CODE ANALYSIS ----------
    - task: SonarCloudAnalyze@4
      displayName: "Run Code Analysis"

    # ---------- STEP 5: PUBLISH QUALITY GATE RESULT ----------
    - task: SonarCloudPublish@4
      displayName: "Publish Quality Gate Result"
      inputs:
        pollingTimeoutSec: '300'
      continueOnError: true  # Skip if quality gate API fails (results still visible in SonarCloud)

# =========================================================
# BUILD AND PUSH DOCKER IMAGES
# =========================================================
- stage: Build
  displayName: "Build Docker Images"
  dependsOn: SAST
  condition: succeededOrFailed()
  jobs:
  - job: BuildImages
    displayName: "Build and Push Container Images"
    steps:
    - checkout: self

    # ---------- LOGIN TO DEV ACR ----------
    - task: AzureCLI@2
      displayName: "Azure Login ACR (DEV)"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(DEV_ACR_NAME)

    # ---------- BUILD DOCKER ----------
    - script: |
        docker build -f backend-a/Dockerfile \
          -t backend-a-local backend-a

        docker build -f backend-b/Dockerfile \
          -t backend-b-local backend-b
      displayName: "Build Docker Images"

    # ---------- TAG AND PUSH TO DEV ACR ----------
    - script: |
        docker tag backend-a-local $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
        docker tag backend-b-local $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)

        docker push $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
        docker push $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)
      displayName: "Push Images to DEV ACR"

    # ---------- TAG AND PUSH TO QA ACR ----------
    - task: AzureCLI@2
      displayName: "Push to QA ACR"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(QA_ACR_NAME)

          docker tag backend-a-local $(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
          docker tag backend-b-local $(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)

          docker push $(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
          docker push $(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)

    # ---------- TAG AND PUSH TO PROD ACR ----------
    - task: AzureCLI@2
      displayName: "Push to PROD ACR"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(PROD_ACR_NAME)

          docker tag backend-a-local $(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
          docker tag backend-b-local $(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)

          docker push $(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
          docker push $(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)

# =========================================================
# CONTAINER SECURITY SCAN - TRIVY
# =========================================================
- stage: ContainerScan
  displayName: "Trivy Container Vulnerability Scan"
  dependsOn: Build
  condition: succeededOrFailed()
  jobs:
  - job: TrivyScan
    displayName: "Scan Container Images"
    steps:
    - checkout: self

    # ---------- LOGIN TO DEV ACR ----------
    - task: AzureCLI@2
      displayName: "Azure Login ACR (DEV)"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(DEV_ACR_NAME)

    # ---------- PULL IMAGES FROM ACR ----------
    - script: |
        docker pull $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
        docker pull $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)
      displayName: "Pull Images from DEV ACR"

    # ---------- INSTALL TRIVY ----------
    - script: |
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy -y
      displayName: "Install Trivy"

    # ---------- DOWNLOAD TRIVY HTML TEMPLATE ----------
    - script: |
        curl -sSL -o html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/v0.48.0/contrib/html.tpl
      displayName: "Download Trivy HTML template"

    # ---------- TRIVY HTML REPORT - BACKEND A ----------
    - script: |
        trivy image \
          --format template \
          --template "@html.tpl" \
          --output trivy-backend-a.html \
          $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG)
      displayName: "Generate Trivy HTML Report - Backend A"

    # ---------- TRIVY HTML REPORT - BACKEND B ----------
    - script: |
        trivy image \
          --format template \
          --template "@html.tpl" \
          --output trivy-backend-b.html \
          $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)
      displayName: "Generate Trivy HTML Report - Backend B"

    # ---------- FAIL PIPELINE IF CRITICAL/HIGH ----------
    - script: |
        trivy image --severity CRITICAL,HIGH --exit-code 1 $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG) || echo "Backend A has vulnerabilities"
        trivy image --severity CRITICAL,HIGH --exit-code 1 $(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG) || echo "Backend B has vulnerabilities"
      displayName: "Fail Build if High/Critical CVEs Found"
      continueOnError: true

    # ---------- COPY AND PUBLISH TRIVY REPORTS ----------
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/trivy-reports
        cp trivy-backend-a.html $(Build.ArtifactStagingDirectory)/trivy-reports/ || echo "Backend A report not found"
        cp trivy-backend-b.html $(Build.ArtifactStagingDirectory)/trivy-reports/ || echo "Backend B report not found"
      displayName: "Copy Trivy Reports to Staging"
      condition: succeededOrFailed()

    - task: PublishBuildArtifacts@1
      displayName: "Publish Trivy HTML Reports"
      inputs:
        PathtoPublish: "$(Build.ArtifactStagingDirectory)/trivy-reports"
        ArtifactName: "trivy-reports"
        publishLocation: "Container"
      condition: succeededOrFailed()

# =========================================================
# ARGOCD DEPLOYMENT
# =========================================================
- stage: ArgoCD
  displayName: "Deploy ArgoCD to AKS Clusters"
  dependsOn: ContainerScan
  condition: succeededOrFailed()
  jobs:
  - job: DeployArgoCD
    displayName: "Install ArgoCD on all clusters"
    steps:
    - checkout: self

    # ---------- DEPLOY ARGOCD TO DEV ----------
    - task: AzureCLI@2
      displayName: "Deploy ArgoCD to DEV AKS"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          echo "Connecting to DEV AKS cluster..."
          az aks get-credentials \
            --resource-group $(DEV_RESOURCE_GROUP) \
            --name $(DEV_AKS_NAME) \
            --admin \
            --overwrite-existing

          echo "Installing ArgoCD namespace..."
          kubectl apply -f argocd/install.yaml

          echo "Installing ArgoCD components..."
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          echo "Waiting for ArgoCD to be ready..."
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd || true

          echo "Getting ArgoCD initial admin password..."
          kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d || echo "Password secret not ready yet"
      continueOnError: true

    # ---------- DEPLOY ARGOCD TO QA ----------
    - task: AzureCLI@2
      displayName: "Deploy ArgoCD to QA AKS"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          echo "Connecting to QA AKS cluster..."
          az aks get-credentials \
            --resource-group $(QA_RESOURCE_GROUP) \
            --name $(QA_AKS_NAME) \
            --admin \
            --overwrite-existing

          echo "Installing ArgoCD namespace..."
          kubectl apply -f argocd/install.yaml

          echo "Installing ArgoCD components..."
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          echo "Waiting for ArgoCD to be ready..."
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd || true

          echo "Getting ArgoCD initial admin password..."
          kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d || echo "Password secret not ready yet"
      continueOnError: true

    # ---------- DEPLOY ARGOCD TO PROD ----------
    - task: AzureCLI@2
      displayName: "Deploy ArgoCD to PROD AKS"
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          echo "Connecting to PROD AKS cluster..."
          az aks get-credentials \
            --resource-group $(PROD_RESOURCE_GROUP) \
            --name $(PROD_AKS_NAME) \
            --admin \
            --overwrite-existing

          echo "Installing ArgoCD namespace..."
          kubectl apply -f argocd/install.yaml

          echo "Installing ArgoCD components..."
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          echo "Waiting for ArgoCD to be ready..."
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd || true

          echo "Getting ArgoCD initial admin password..."
          kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d || echo "Password secret not ready yet"
      continueOnError: true

# =========================================================
# DEV
# =========================================================
- stage: Dev
  displayName: "Deploy to Development"
  dependsOn: ArgoCD
  condition: succeededOrFailed()
  jobs:
  - deployment: DeployDev
    displayName: "Deploy to DEV AKS"
    environment: dev-env
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Deploy to DEV AKS"
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group $(DEV_RESOURCE_GROUP) \
                  --name $(DEV_AKS_NAME) \
                  --admin \
                  --overwrite-existing

                # Wait for at least one node to be ready
                echo "Waiting for cluster nodes to be ready..."
                for i in {1..60}; do
                  NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "Ready" || echo "0")
                  if [ "$NODE_COUNT" -gt 0 ]; then
                    echo "Found $NODE_COUNT ready node(s)"
                    break
                  fi
                  echo "No ready nodes yet, waiting... ($i/60)"
                  sleep 10
                done

                kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.6/deploy/static/provider/cloud/deploy.yaml

                # Wait for ingress controller deployment to be ready
                echo "Waiting for ingress-nginx controller deployment to be ready..."
                kubectl wait --namespace ingress-nginx \
                  --for=condition=ready pod \
                  --selector=app.kubernetes.io/component=controller \
                  --timeout=500s

                # Patch ingress controller to use LoadBalancer
                kubectl patch svc ingress-nginx-controller -n ingress-nginx -p '{"spec":{"type":"LoadBalancer"}}'

                cd k8s/overlays/dev
                kustomize edit set image backend-a=$(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG) backend-b=$(DEV_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)

                # Deploy backend manifests
                kubectl apply -k .

                # Deploy ArgoCD Application for continuous GitOps sync
                echo "Deploying ArgoCD Application for DEV..."
                kubectl apply -f ../../../argocd/app-dev.yaml

                # Wait for LoadBalancer IP
                echo "Waiting for ingress LoadBalancer IP..."
                for i in {1..60}; do
                  INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                  if [ ! -z "$INGRESS_IP" ]; then
                    echo "Ingress LoadBalancer IP: $INGRESS_IP"
                    break
                  fi
                  sleep 5
                done

                # Update APIM backends
                if [ ! -z "$INGRESS_IP" ]; then
                  az apim api update \
                    --resource-group $(DEV_RESOURCE_GROUP) \
                    --service-name apim-capstone-dev-a1b2c \
                    --api-id backend-a-api \
                    --service-url "http://$INGRESS_IP/api/a"
                  az apim api update \
                    --resource-group $(DEV_RESOURCE_GROUP) \
                    --service-name apim-capstone-dev-a1b2c \
                    --api-id backend-b-api \
                    --service-url "http://$INGRESS_IP/api/b"
                fi

                kubectl delete pod -n $(K8S_NAMESPACE) --all

# =========================================================
# DAST - OWASP ZAP API SECURITY SCAN
# =========================================================
- stage: DAST
  displayName: "OWASP ZAP API Security Scan"
  dependsOn: Dev
  condition: succeededOrFailed()
  jobs:
  - job: ZAPScan
    displayName: "Dynamic Application Security Testing"
    steps:
    - checkout: none

    # ---------- INSTALL OWASP ZAP ----------
    - script: |
        docker pull ghcr.io/zaproxy/zaproxy:stable
      displayName: "Pull OWASP ZAP Docker Image"

    # ---------- ZAP API SCAN - BACKEND A ----------
    - script: |
        docker run --rm \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t https://apim-capstone-dev-a1b2c.azure-api.net/api/a \
          -I || true
      displayName: "ZAP Baseline Scan - Backend A"
      continueOnError: true

    # ---------- ZAP API SCAN - BACKEND B ----------
    - script: |
        docker run --rm \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t https://apim-capstone-dev-a1b2c.azure-api.net/api/b \
          -I || true
      displayName: "ZAP Baseline Scan - Backend B"
      continueOnError: true

# =========================================================
# QA
# =========================================================
- stage: QA
  displayName: "Deploy to QA"
  dependsOn: DAST
  condition: succeeded()
  jobs:
  - deployment: DeployQA
    displayName: "Deploy to QA AKS"
    environment: qa-env
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Deploy to QA AKS"
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group $(QA_RESOURCE_GROUP) \
                  --name $(QA_AKS_NAME) \
                  --admin \
                  --overwrite-existing

                # Wait for nodes
                for i in {1..60}; do
                  NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "Ready" || echo "0")
                  if [ "$NODE_COUNT" -gt 0 ]; then
                    break
                  fi
                  sleep 10
                done

                kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.6/deploy/static/provider/cloud/deploy.yaml
                kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=500s
                kubectl patch svc ingress-nginx-controller -n ingress-nginx -p '{"spec":{"type":"LoadBalancer"}}'

                cd k8s/overlays/qa
                kustomize edit set image backend-a=$(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG) backend-b=$(QA_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)
                kubectl apply -k .

                # Deploy ArgoCD Application for continuous GitOps sync
                echo "Deploying ArgoCD Application for QA..."
                kubectl apply -f ../../../argocd/app-qa.yaml

                for i in {1..60}; do
                  INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                  if [ ! -z "$INGRESS_IP" ]; then
                    az apim api update --resource-group $(QA_RESOURCE_GROUP) --service-name apim-capstone-qa-a1b2c --api-id backend-a-api --service-url "http://$INGRESS_IP/api/a"
                    az apim api update --resource-group $(QA_RESOURCE_GROUP) --service-name apim-capstone-qa-a1b2c --api-id backend-b-api --service-url "http://$INGRESS_IP/api/b"
                    break
                  fi
                  sleep 5
                done

                kubectl delete pod -n $(K8S_NAMESPACE) --all

# =========================================================
# PROD
# =========================================================
- stage: Prod
  displayName: "Deploy to Production"
  dependsOn: QA
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    displayName: "Deploy to PROD AKS"
    environment: production-env
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Deploy to PROD AKS"
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group $(PROD_RESOURCE_GROUP) \
                  --name $(PROD_AKS_NAME) \
                  --admin \
                  --overwrite-existing

                # Wait for nodes
                for i in {1..60}; do
                  NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "Ready" || echo "0")
                  if [ "$NODE_COUNT" -gt 0 ]; then
                    break
                  fi
                  sleep 10
                done

                kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.6/deploy/static/provider/cloud/deploy.yaml
                kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=500s
                kubectl patch svc ingress-nginx-controller -n ingress-nginx -p '{"spec":{"type":"LoadBalancer"}}'

                cd k8s/overlays/prod
                kustomize edit set image backend-a=$(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-a:$(IMAGE_TAG) backend-b=$(PROD_ACR_NAME)$(ACR_LOGIN_SERVER_SUFFIX)/backend-b:$(IMAGE_TAG)
                kubectl apply -k .

                # Deploy ArgoCD Application for continuous GitOps sync
                echo "Deploying ArgoCD Application for PROD..."
                kubectl apply -f ../../../argocd/app-prod.yaml

                for i in {1..60}; do
                  INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                  if [ ! -z "$INGRESS_IP" ]; then
                    az apim api update --resource-group $(PROD_RESOURCE_GROUP) --service-name apim-capstone-prod-a1b2c --api-id backend-a-api --service-url "http://$INGRESS_IP/api/a"
                    az apim api update --resource-group $(PROD_RESOURCE_GROUP) --service-name apim-capstone-prod-a1b2c --api-id backend-b-api --service-url "http://$INGRESS_IP/api/b"
                    break
                  fi
                  sleep 5
                done

                kubectl delete pod -n $(K8S_NAMESPACE) --all
