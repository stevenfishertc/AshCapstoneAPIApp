# ArgoCD Application for QA Environment
# This configures ArgoCD to sync backend-a and backend-b deployments to the QA AKS cluster

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backends-qa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/stevenfishertc/AshCapstoneAPIApp.git
    targetRevision: HEAD
    path: k8s/overlays/qa

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
