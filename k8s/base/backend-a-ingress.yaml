apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-a-ingress
  namespace: capstone-backend
spec:
  ingressClassName: nginx
  rules:
  - host: backend-a.dev.example.com
    http:
      paths:
      - path: /api/a
        pathType: Prefix
        backend:
          service:
            name: backend-a
            port:
              number: 80
